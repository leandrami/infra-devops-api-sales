# NÃO versionar o secret real. Crie com:
#   kubectl -n sales create secret generic sales-secret \
#     --from-literal=DB_USER=sales --from-literal=DB_PASSWORD='senha-forte'
apiVersion: v1
kind: Secret
metadata:
  name: sales-secret
  namespace: sales
type: Opaque
stringData:
  DB_USER: sales
  DB_PASSWORD: troque_esta_senha
